# Environment used by Read the Docs (see .readthedocs.yml) and for building the docs locally.
name: toff-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # TOFF's own dependencies (TOFF itself is installed by Read the Docs with pip)
  - rdkit
  - pyyaml
  - numpy
  # Sphinx and extensions used in docs/conf.py
  - sphinx
  - myst-nb
  - myst-parser
  - sphinx-book-theme
  - sphinx-design
  - sphinx-copybutton
  - sphinx-inline-tabs
  - ipython          # IPython.sphinxext.* extensions
  - ipykernel
  # Local live preview: sphinx-autobuild docs docs/_build/html
  - sphinx-autobuild
