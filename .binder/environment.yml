# Environment for trying TOFF on Binder (https://mybinder.org reads .binder/environment.yml)
name: toff
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - openmm
  - openff-toolkit
  - openmmforcefields
  - parmed
  - rdkit
  - pyyaml
  - matplotlib-base
  - requests
  - pip:
    - toff
