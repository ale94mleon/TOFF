# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Login shell: setup-micromamba (init-shell: bash) activates the environment in every step
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            espaloma: true
          - os: ubuntu-24.04-arm
            name: Linux ARM
            espaloma: false   # dgl (needed by Espaloma) is not built for linux-aarch64
          - os: macos-latest
            name: macOS Apple Silicon
            espaloma: true
          - os: macos-15-intel
            name: macOS Intel
            espaloma: true
    steps:
    - uses: actions/checkout@v6
    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: ci
        create-args: >-
          python=${{ matrix.python-version }}
          openff-toolkit
          openmm
          openmmforcefields
          ambertools
          importlib-resources
          parmed
          ${{ matrix.espaloma && 'espaloma>=0.3.2' || '' }}
          ${{ runner.os == 'Linux' && 'patchelf' || '' }}
        init-shell: bash
        cache-environment: true
        post-cleanup: 'environment'
    - name: Clear executable-stack flag from old PyTorch builds (glibc >= 2.41)
      if: runner.os == 'Linux' && matrix.espaloma
      run: |
        torch_lib="$CONDA_PREFIX/lib/libtorch_cpu.so"
        if [[ -f "$torch_lib" ]]; then patchelf --clear-execstack "$torch_lib"; fi
    - name: Install pip dependencies and toff on dev mode
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        pip install -e '.[dev]'
        python -m pip install pytest-cov
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/toff --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src/toff --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        echo after "Lint with flake8" My python version is actually: $(python --version).
    - name: Test with pytest
      run: pytest tests --cov toff --cov-report xml
    - name: Environment details
      if: always()
      run: micromamba list
    # Temporary: investigate GAFF failing on macOS Intel (antechamber reads no atoms).
    # Runs on every platform so the working ones serve as reference; never fails the job.
    - name: antechamber diagnostics
      if: always()
      continue-on-error: true
      run: bash .github/scripts/antechamber-diagnostics.sh
    - name: Run codacy-coverage-reporter
      uses: codacy/codacy-coverage-reporter-action@v1.3.0
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml
